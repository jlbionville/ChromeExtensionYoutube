<!DOCTYPE html>
<html>
<head>
  <title>YouTube Extract</title>
  <style>
    body {
      width: 200px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    
    h3 {
      margin-top: 0;
      color: #1a73e8;
      text-align: center;
    }
    
    button {
      width: 100%;
      padding: 10px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    
    button:hover {
      background-color: #1557b0;
    }
    
    .shortcut-info {
      margin-top: 15px;
      font-size: 12px;
      color: #666;
      text-align: center;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <h3>🎥 YouTube Extract</h3>
  <button id="extractBtn">📄 Extraire maintenant</button>
  <div class="shortcut-info">
    Raccourci: Ctrl+Shift+Y
  </div>
  <script src="popup.js"></script>
</body>
</html>
